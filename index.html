<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontenin AI v2.7 Pro - Storyboard & AI Generator</title>
    <!-- Tailwind CSS untuk Desain Minimalis -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold">
                <i class="fa-solid fa-clapperboard"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Kontenin AI</h1>
                <span class="text-xs text-indigo-400">v2.7 Pro Commercial</span>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="openHistory()" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-full text-slate-300 w-10 h-10 flex items-center justify-center transition" title="Riwayat">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
            <button onclick="openHelp()" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-full text-slate-300 w-10 h-10 flex items-center justify-center transition" title="Bantuan">
                <i class="fa-solid fa-circle-question"></i>
            </button>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 pb-24 space-y-6">
        
        <!-- Kotak Ide / Input Utama -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Ide Konten / Produk</label>
                <textarea id="sbInput" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500 text-sm" placeholder="Contoh: Jualan kaos polos aesthetic anti bau dengan latar kafe..."></textarea>
            </div>

            <!-- Upload Gambar Referensi (Galeri HP) -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Upload Referensi (Opsional)</label>
                <div class="grid grid-cols-3 gap-2">
                    <label class="border border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-3 text-center cursor-pointer flex flex-col items-center justify-center bg-slate-950 transition">
                        <i class="fa-solid fa-image text-indigo-400 mb-1"></i>
                        <span class="text-[10px] text-slate-400">Karakter</span>
                        <input type="file" id="imgChar" accept="image/*" class="hidden" onchange="previewImage(this, 'previewChar')">
                    </label>
                    <label class="border border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-3 text-center cursor-pointer flex flex-col items-center justify-center bg-slate-950 transition">
                        <i class="fa-solid fa-mountain-sun text-indigo-400 mb-1"></i>
                        <span class="text-[10px] text-slate-400">Latar</span>
                        <input type="file" id="imgLoc" accept="image/*" class="hidden" onchange="previewImage(this, 'previewLoc')">
                    </label>
                    <label class="border border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-3 text-center cursor-pointer flex flex-col items-center justify-center bg-slate-950 transition">
                        <i class="fa-solid fa-box-open text-indigo-400 mb-1"></i>
                        <span class="text-[10px] text-slate-400">Produk</span>
                        <input type="file" id="imgProd" accept="image/*" class="hidden" onchange="previewImage(this, 'previewProd')">
                    </label>
                </div>
                <!-- Area Pratinjau Gambar Terpilih -->
                <div id="imagePreviewContainer" class="flex space-x-2 mt-2"></div>
            </div>

            <!-- Pilihan Pengaturan (Scene, Durasi, Gaya Suara) -->
            <div class="grid grid-cols-3 gap-3 pt-2 border-t border-slate-800">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Jumlah Scene</label>
                    <select id="sbCount" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
                        <option value="3">3 Scene</option>
                        <option value="5" selected>5 Scene</option>
                        <option value="8">8 Scene</option>
                        <option value="10">10 Scene</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Durasi Total</label>
                    <select id="sbDuration" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
                        <option value="15">15 Detik</option>
                        <option value="30" selected>30 Detik</option>
                        <option value="60">60 Detik</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Gaya Suara (VO)</label>
                    <select id="sbVoStyle" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
                        <option value="ASMR Lembut">ASMR Lembut</option>
                        <option value="Affiliate Semangat" selected>Affiliate Semangat</option>
                        <option value="Cinematic Deep">Cinematic Deep</option>
                    </select>
                </div>
            </div>

            <!-- Tombol Generate -->
            <button onclick="runStoryboardGen()" id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>Generate Storyboard AI</span>
            </button>
        </div>

        <!-- Hasil Storyboard -->
        <div id="resultArea" class="space-y-4"></div>

    </main>

    <!-- JavaScript Utama -->
    <script>
        let uploadedImages = {};

        // Fungsi Ambil Gambar dari Galeri HP dan Ubah jadi Data digital
        function praktikan(input, key) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImages[key] = e.target.result;
                    alert("Gambar berhasil dipilih dari galeri!");
                }
                reader.readAsDataURL(file);
            }
        }

        // Fungsi khusus preview gambar (bisa dikembangkan sesuai kebutuhan)
        function previewImage(input, previewId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImages[input.id] = e.target.result;
                    let container = document.getElementById('imagePreviewContainer');
                    let existing = document.getElementById(previewId);
                    if(existing) existing.remove();
                    
                    let img = document.createElement('img');
                    img.id = previewId;
                    img.src = e.target.result;
                    img.className = "w-14 h-14 object-cover rounded-lg border border-indigo-500";
                    container.appendChild(img);
                }
                reader.readAsDataURL(file);
            }
        }

        async function runStoryboardGen() {
            const text = document.getElementById('sbInput').value.trim();
            const count = document.getElementById('sbCount').value;
            const durationTotal = document.getElementById('sbDuration').value;
            const voStyle = document.getElementById('sbVoStyle').value;
            const resultArea = document.getElementById('resultArea');
            const btn = document.getElementById('generateBtn');

            if (!text) {
                alert('Tuliskan ide konten atau produknya dulu ya!');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Sedang Meracik AI...</span>`;
            resultArea.innerHTML = '';

            try {
                // Memanggil Pelayan Toko (Backend Vercel)
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text, 
                        count, 
                        durationTotal, 
                        voStyle, 
                        mainCategory: "General Commercial",
                        images: uploadedImages 
                    })
                });

                const result = await response.json();
                
                if (result.success && Array.isArray(result.data)) {
                    result.data.forEach((item, index) => {
                        let card = document.createElement('div');
                        card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-md";
                        card.innerHTML = `
                            <div class="flex justify-between items-center text-xs text-indigo-400 font-semibold border-b border-slate-800 pb-2">
                                <span>SCENE ${item.scene || (index + 1)} (${item.timing || '0-5 Detik'})</span>
                                <span class="bg-slate-800 px-2 py-1 rounded text-slate-300">Shot ${index + 1}</span>
                            </div>
                            <div class="bg-slate-950 p-3 rounded-xl text-sm text-slate-200">
                                <p class="font-medium text-indigo-300 mb-1"><i class="fa-solid fa-video mr-1"></i> Visual:</p>
                                <p>${item.visual_prompt}</p>
                            </div>
                            <div class="bg-slate-950 p-3 rounded-xl text-sm text-slate-200">
                                <p class="font-medium text-emerald-400 mb-1"><i class="fa-solid fa-microphone mr-1"></i> Voiceover (${voStyle}):</p>
                                <p>"${item.voiceover}"</p>
                            </div>
                        `;
                        resultArea.appendChild(card);
                    });
                } else {
                    throw.error('Format data salah');
                }
            } catch (error) {
                console.error(error);
                resultArea.innerHTML = `<div class="bg-red-950/50 border border-red-800 p-4 rounded-xl text-red-300 text-sm">Gagal menghubungkan ke Pelayan Toko. Coba sesaat lagi ya!</div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i><span>Generate Storyboard AI</span>`;
            }
        }

        function openHistory() { alert("Fitur riwayat tersimpan akan segera hadir!"); }
        function openHelp() { alert("Kontenin AI v2.7 Pro - Masukkan ide, upload referensi, dan generate storyboard komersialmu dengan aman!"); }
    </script>
</body>
</html>
