    <title>Kontenin AI v2.7 Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#09090b',
                        cardBg: '#18181b',
                        accentGold: '#f59e0b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen font-sans antialiased selection:bg-amber-500 selection:text-black">

    <div class="max-w-md mx-auto min-h-screen flex flex-col p-4 border-x border-zinc-800 bg-darkBg">
        <!-- Header -->
        <header class="flex justify-between items-center py-3 mb-4 border-b border-zinc-800">
            <div>
                <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
                    🎬 KONTENIN AI <span class="text-[10px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full border border-amber-500/30">v2.7 Pro</span>
                </h1>
                <p class="text-[11px] text-zinc-400">Sutradara & Storyboard Generator Otomatis</p>
            </div>
        </header>

        <!-- Main Content Form -->
        <main class="space-y-4 flex-1 pb-10">
            <!-- Pengaturan API Key Langsung -->
            <div class="bg-cardBg border border-zinc-800 p-3 rounded-xl">
                <label class="block text-[11px] font-medium text-amber-400 mb-1">Gemini API Key (Masukkan sekali saja)</label>
                <input type="password" id="apiKeyInput" placeholder="Tempel API Key Google AI Studio di sini..." class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500">
            </div>

            <!-- Kategori Konten -->
            <div>
                <label class="block text-xs font-medium text-zinc-300 mb-1">Kategori Konten</label>
                <select id="mainCategory" class="w-full bg-cardBg border border-zinc-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                    <option value="TikTok / Reels / Shorts">TikTok / Reels / Shorts</option>
                    <option value="Iklan Produk / Meta Ads">Iklan Produk / Meta Ads</option>
                    <option value="Video Animasi / Edukasi">Video Animasi / Edukasi</option>
                </select>
            </div>

            <!-- Upload Aset Referensi (Karakter, Latar, Produk) dengan Kompresi Otomatis -->
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="uploadAsset('Karakter')" class="bg-cardBg border border-zinc-700 hover:border-amber-500/50 rounded-xl p-2.5 text-center transition flex flex-col items-center justify-center gap-1 group">
                    <span class="text-lg">👤</span>
                    <span class="text-[10px] font-medium text-zinc-300 group-hover:text-amber-400">Karakter</span>
                    <span id="lblKarakter" class="text-[9px] text-zinc-500">Pilih Foto</span>
                </button>
                <button type="button" onclick="uploadAsset('Latar')" class="bg-cardBg border border-zinc-700 hover:border-amber-500/50 rounded-xl p-2.5 text-center transition flex flex-col items-center justify-center gap-1 group">
                    <span class="text-lg">🌄</span>
                    <span class="text-[10px] font-medium text-zinc-300 group-hover:text-amber-400">Latar</span>
                    <span id="lblLatar" class="text-[9px] text-zinc-500">Pilih Foto</span>
                </button>
                <button type="button" onclick="uploadAsset('Produk')" class="bg-cardBg border border-zinc-700 hover:border-amber-500/50 rounded-xl p-2.5 text-center transition flex flex-col items-center justify-center gap-1 group">
                    <span class="text-lg">📦</span>
                    <span class="text-[10px] font-medium text-zinc-300 group-hover:text-amber-400">Produk</span>
                    <span id="lblProduk" class="text-[9px] text-zinc-500">Pilih Foto</span>
                </button>
            </div>

            <!-- Input File Tersembunyi -->
            <input type="file" id="hiddenGaleriInput" accept="image/*" class="hidden" onchange="prosesDanKompresFile(this)">

            <!-- Isi Kepala (Perintah Utama Ide Cerita) -->
            <div>
                <label class="block text-xs font-medium text-zinc-300 mb-1">Isi Kepala (Ide Cerita / Skenario)</label>
                <textarea id="ideaInput" rows="4" class="w-full bg-cardBg border border-zinc-700 rounded-lg p-3 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500" placeholder="Tuliskan ide di kepala kamu untuk merealisasikan kombinasi karakter, latar, dan produk..."></textarea>
            </div>

            <!-- Pengaturan Scene & Durasi -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-zinc-300 mb-1">Jumlah Scene</label>
                    <select id="sceneCount" class="w-full bg-cardBg border border-zinc-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-amber-500">
                        <option value="3">3 Scene</option>
                        <option value="5" selected>5 Scene</option>
                        <option value="7">7 Scene</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-300 mb-1">Total Durasi</label>
                    <select id="totalDuration" class="w-full bg-cardBg border border-zinc-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-amber-500">
                        <option value="15 Detik">15 Detik</option>
                        <option value="30 Detik" selected>30 Detik</option>
                        <option value="60 Detik">60 Detik</option>
                    </select>
                </div>
            </div>

            <!-- Gaya Bahasa Voiceover (VO) -->
            <div>
                <label class="block text-xs font-medium text-zinc-300 mb-1">Gaya Bahasa Voiceover (VO)</label>
                <select id="voStyle" class="w-full bg-cardBg border border-zinc-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                    <option value="Santai & Persuasif (Hard Selling)">Santai & Persuasif (Hard Selling)</option>
                    <option value="Edukatif & Storytelling">Edukatif & Storytelling</option>
                    <option value="Hype & Bersemangat">Hype & Bersemangat</option>
                </select>
            </div>

            <!-- Tombol Eksekusi Generate -->
            <button type="button" onclick="generateStoryboard()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black font-bold py-3 px-4 rounded-xl text-xs tracking-wide transition shadow-lg shadow-amber-500/20 mt-2">
                ✨ GENERATE STORYBOARD NYATA
            </button>

            <!-- Area Hasil Storyboard -->
            <div id="storyboardResultContainer" class="mt-6 space-y-4"></div>
        </main>
    </div>

    <!-- Script Logika Frontend menggunakan gemini-3.8-flash -->
    <script>
        let uploadedImages = { Karakter: null, Latar: null, Produk: null };
        let activeUploadType = '';

        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_user_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        function uploadAsset(type) {
            activeUploadType = type;
            document.getElementById('hiddenGaleriInput').click();
        }

        function prosesDanKompresFile(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    uploadedImages[activeUploadType] = compressedDataUrl;

                    const labelMap = { 'Karakter': 'lblKarakter', 'Latar': 'lblLatar', 'Produk': 'lblProduk' };
                    const el = document.getElementById(labelMap[activeUploadType]);
                    if (el) {
                        el.innerText = "Terkompresi ✓";
                        el.className = "text-[9px] text-emerald-400 font-bold";
                    }
                };
            };
        }

        async function generateStoryboard() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const text = document.getElementById('ideaInput').value.trim();
            const count = document.getElementById('sceneCount').value;
            const durationTotal = document.getElementById('totalDuration').value;
            const voStyle = document.getElementById('voStyle').value;
            const mainCategory = document.getElementById('mainCategory').value;

            if (!apiKey) {
                alert("Masukkan dulu Gemini API Key kamu di kolom atas!");
                return;
            }
            if (!text) {
                alert("Silakan isi dulu bagian 'Isi Kepala' (ide cerita)!");
                return;
            }

            localStorage.setItem('gemini_user_api_key', apiKey);

            const container = document.getElementById('storyboardResultContainer');
            container.innerHTML = `<div class="text-center py-6 text-xs text-amber-400 animate-pulse">🎬 Sutradara AI (gemini-3.8-flash) sedang meracik kombinasi visual dan naskah scene...</div>`;

            let contents = [];
            let parts = [];

            if (uploadedImages.Karakter) {
                parts.push({
                    inlineData: {
                        mimeType: 'image/jpeg',
                        data: uploadedImages.Karakter.split(';base64,').pop()
                    }
                });
            }
            if (uploadedImages.Latar) {
                parts.push({
                    inlineData: {
                        mimeType: 'image/jpeg',
                        data: uploadedImages.Latar.split(';base64,').pop()
                    }
                });
            }
            if (uploadedImages.Produk) {
                parts.push({
                    inlineData: {
                        mimeType: 'image/jpeg',
                        data: uploadedImages.Produk.split(';base64,').pop()
                    }
                });
            }

            const promptText = `
                Bertindaklah sebagai Sutradara AI dan Copywriting Profesional untuk konten ${mainCategory}.
                Buatkan ${count} scene storyboard video berdurasi total ${durationTotal} detik berdasarkan ide berikut: "${text}".
                Gaya bahasa Voiceover (VO) menggunakan nada: ${voStyle}.
                Kombinasikan referensi foto (Karakter, Latar, Produk) di atas secara presisi ke dalam setiap deskripsi visual scene.
                Berikan output dalam format JSON murni berupa array object tanpa teks pengantar markdown lainnya:
                [
                  {
                    "scene": 1,
                    "timing": "0 - 5 Detik",
                    "visual_prompt": "Deskripsi sinematik detail penggabungan karakter, latar, dan produk untuk scene ini",
                    "voiceover": "Teks naskah voiceover yang menarik"
                  }
                ]
            `;
            parts.push({ text: promptText });
            contents.push({ parts: parts });

            try {
                // Menggunakan model gemini-3.8-flash secara eksplisit sesuai permintaan
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: contents })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message || 'Gagal dari server Gemini.');
                }

                if (!data.candidates || !data.candidates[0].content) {
                    throw new Error('Respon dari Gemini kosong atau diblokir.');
                }

                const rawText = data.candidates[0].content.parts[0].text.trim();
                const cleanJsonText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                const storyboardArray = JSON.parse(cleanJsonText);

                tampilkanHasilStoryboard(storyboardArray);

            } catch (err) {
                console.error("Error:", err);
                container.innerHTML = `<div class="bg-red-950/50 border border-red-800 text-red-300 p-3 rounded-xl text-xs">Gagal: ${err.message}</div>`;
            }
        }

        function tampilkanHasilStoryboard(dataArray) {
            const container = document.getElementById('storyboardResultContainer');
            container.innerHTML = '<h2 class="text-xs font-bold text-amber-400 mb-2 uppercase tracking-wide">✨ Hasil Storyboard & Panel Visual:</h2>';
            
            dataArray.forEach((item) => {
                let sceneImg = uploadedImages.Produk || uploadedImages.Karakter || uploadedImages.Latar || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop';

                const card = document.createElement('div');
                card.className = "bg-cardBg border border-zinc-800 rounded-2xl p-4 text-white shadow-xl space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-[11px] font-extrabold bg-amber-500/20 text-amber-400 px-2.5 py-1 rounded-full border border-amber-500/30">Scene ${item.scene}</span>
                        <span class="text-[10px] text-zinc-400 font-mono">⏱️ ${item.timing}</span>
                    </div>

                    <!-- Panel Visual / Preview Gambar Scene -->
                    <div class="relative rounded-xl overflow-hidden border border-zinc-700 bg-zinc-950 aspect-video flex items-center justify-center group">
                        <img src="${sceneImg}" alt="Visual Scene ${item.scene}" class="w-full h-full object-cover opacity-90 group-hover:scale-105 transition duration-300">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex items-end p-3">
                            <p class="text-[10px] text-zinc-200 leading-tight"><strong class="text-amber-400">Deskripsi Visual:</strong> ${item.visual_prompt}</p>
                        </div>
                    </div>

                    <!-- Caption / Voiceover Box -->
                    <div class="bg-zinc-950 border border-zinc-800 p-3 rounded-xl space-y-1">
                        <div class="text-[9px] font-bold text-emerald-400 uppercase tracking-wider">Voiceover (Caption):</div>
                        <p class="text-xs text-zinc-100 italic">"${item.voiceover}"</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>

            }

            const promptText = `
                Bertindaklah sebagai Sutradara AI dan Copywriting Profesional untuk konten ${mainCategory}.
                Buatkan ${count} scene storyboard video berdurasi total ${durationTotal} detik berdasarkan ide berikut: "${text}".
                Gaya bahasa Voiceover (VO) menggunakan nada: ${voStyle}.
                Kombinasikan referensi foto (Karakter, Latar, Produk) di atas secara presisi ke dalam setiap deskripsi visual scene.
                Berikan output dalam format JSON murni berupa array object tanpa teks pengantar markdown lainnya:
                [
                  {
                    "scene": 1,
                    "timing": "0 - 5 Detik",
                    "visual_prompt": "Deskripsi sinematik detail penggabungan karakter, latar, dan produk untuk scene ini",
                    "voiceover": "Teks naskah voiceover yang menarik"
                  }
                ]
            `;
            parts.push({ text: promptText });
            contents.push({ parts: parts });

            try {
                // Diperbarui menggunakan gemini-3.8-flash sesuai instruksi sistem Google
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: contents })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message || 'Gagal dari server Gemini.');
                }

                if (!data.candidates || !data.candidates[0].content) {
                    throw new Error('Respon dari Gemini kosong atau diblokir.');
                }

                const rawText = data.candidates[0].content.parts[0].text.trim();
                const cleanJsonText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                const storyboardArray = JSON.parse(cleanJsonText);

                tampilkanHasilStoryboard(storyboardArray);

            } catch (err) {
                console.error("Error:", err);
                container.innerHTML = `<div class="bg-red-950/50 border border-red-800 text-red-300 p-3 rounded-xl text-xs">Gagal: ${err.message}</div>`;
            }
        }

        function tampilkanHasilStoryboard(dataArray) {
            const container = document.getElementById('storyboardResultContainer');
            container.innerHTML = '<h2 class="text-xs font-bold text-amber-400 mb-2 uppercase tracking-wide">✨ Hasil Storyboard & Panel Visual:</h2>';
            
            dataArray.forEach((item) => {
                let sceneImg = uploadedImages.Produk || uploadedImages.Karakter || uploadedImages.Latar || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop';

                const card = document.createElement('div');
                card.className = "bg-cardBg border border-zinc-800 rounded-2xl p-4 text-white shadow-xl space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-[11px] font-extrabold bg-amber-500/20 text-amber-400 px-2.5 py-1 rounded-full border border-amber-500/30">Scene ${item.scene}</span>
                        <span class="text-[10px] text-zinc-400 font-mono">⏱️ ${item.timing}</span>
                    </div>

                    <!-- Panel Visual / Preview Gambar Scene -->
                    <div class="relative rounded-xl overflow-hidden border border-zinc-700 bg-zinc-950 aspect-video flex items-center justify-center group">
                        <img src="${sceneImg}" alt="Visual Scene ${item.scene}" class="w-full h-full object-cover opacity-90 group-hover:scale-105 transition duration-300">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex items-end p-3">
                            <p class="text-[10px] text-zinc-200 leading-tight"><strong class="text-amber-400">Deskripsi Visual:</strong> ${item.visual_prompt}</p>
                        </div>
                    </div>

                    <!-- Caption / Voiceover Box -->
                    <div class="bg-zinc-950 border border-zinc-800 p-3 rounded-xl space-y-1">
                        <div class="text-[9px] font-bold text-emerald-400 uppercase tracking-wider">Voiceover (Caption):</div>
                        <p class="text-xs text-zinc-100 italic">"${item.voiceover}"</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
